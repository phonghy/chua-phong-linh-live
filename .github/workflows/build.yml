name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job can write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  BUN_VERSION: "1.4.4"

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: bun-darwin-arm64
            binary: ChuaAnNhien-darwin-arm64
            archive: macos-arm64.tar.gz
          - name: macOS (Intel)
            runner: macos-15-intel
            target: bun-darwin-x64
            binary: ChuaAnNhien-darwin-x64
            archive: macos-x64.tar.gz
          - name: Windows (x64)
            runner: windows-latest
            target: bun-windows-x64
            binary: ChuaAnNhien-windows-x64.exe
            archive: windows-x64.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - name: Build executable
        run: npm run package -- --target ${{ matrix.target }}
      - name: Smoke test the executable
        run: node scripts/smoke-desktop.mjs release/${{ matrix.binary }}
      - name: Archive
        id: archive
        env:
          ARCHIVE: ${{ matrix.archive }}
          BINARY: ${{ matrix.binary }}
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          name="ChuaAnNhien-${version}-${ARCHIVE}"
          cd release
          if [[ "${ARCHIVE}" == *.zip ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${BINARY}' -DestinationPath '${name}'"
          else
            tar -czf "${name}" "${BINARY}"
          fi
          echo "file=release/${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ steps.archive.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist-release
          sha256sum ./ChuaAnNhien-* > SHA256SUMS
          cat > notes.md <<'NOTES'
          Chùa An Nhiên LIVE: ứng dụng máy tính (macOS và Windows).

          Giải nén rồi chạy tệp `ChuaAnNhien-…`; trình duyệt tự mở trang quản trị. Dữ liệu lưu trong thư mục người dùng (macOS: `~/Library/Application Support/ChuaAnNhien`, Windows: `%APPDATA%\ChuaAnNhien`). Nhập tài khoản TikTok trong **Cài đặt**.

          Các bản dựng **chưa ký số / chưa notarize**:
          - macOS: nếu bị chặn, chạy `xattr -d com.apple.quarantine ./ChuaAnNhien-darwin-*` hoặc chọn Mở trong Privacy & Security.
          - Windows: SmartScreen có thể cảnh báo; chọn More info → Run anyway.

          Kiểm tra tệp tải về bằng `SHA256SUMS`. Giọng dẫn Linh chỉ có trên macOS.
          NOTES
          # A release may already exist (e.g. created in the GitHub UI): attach to it instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ChuaAnNhien-* SHA256SUMS
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md ChuaAnNhien-* SHA256SUMS
          fi
